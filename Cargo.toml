[package]
name = "axi-uart16550"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
derive-mmio = { git = "https://github.com/us-irs/derive-mmio.git", branch = "inner-mmio-by-shared-ref"}
bitbybit = "1.3"
arbitrary-int = "1.3"
nb = "1"
libm = "0.2"
critical-section = "1"
thiserror = { version = "2", default-features = false }
fugit = "0.3"
embedded-hal-async = "1"
embedded-hal-nb = "1"
embedded-io = "0.6"
embedded-io-async = "0.6"
embassy-sync = "0.6"
raw-slicee = "0.1"

[features]
default = ["1-waker"]
1-waker = []
2-wakers = []
4-wakers = []
8-wakers = []
16-wakers = []
32-wakers = []

[dev-dependencies]
approx = "0.5"
